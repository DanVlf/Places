<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Places</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ8LG4QwBLw1kZTA4I6Qpi8zLPmG8P4=" crossorigin="">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="appHeader">
        <button id="countLabel" class="headerButton countButton" type="button" aria-label="Saved places">0</button>
        <h1>Places</h1>
        <button id="locateButton" class="headerButton" type="button" aria-label="Locate">Locate</button>
        <input id="fileInput" type="file" accept=".json,.geojson,.kml,.csv,application/json,text/csv,application/vnd.google-earth.kml+xml">
      </section>

      <section id="mapPage" class="page isActive">
        <section class="mapPanel" aria-label="Saved places map">
          <div id="mapView"></div>
          <canvas id="mapCanvas" width="720" height="720"></canvas>
          <span id="locationOverlay"></span>
          <p id="mapStatus">Map tiles need internet</p>
        </section>

        <section class="listPanel">
          <ul id="placesList"></ul>
        </section>
      </section>

      <section id="categoryPage" class="page">
        <ul id="categoryList" class="categoryList"></ul>
      </section>

      <section id="editor" class="editor" hidden>
        <form id="placeForm">
          <button id="dismissKeyboardButton" class="keyboardButton" type="button" aria-label="Hide keyboard">v</button>
          <label>
            Name
            <input id="nameInput" name="name" required autocomplete="off">
          </label>
          <label>
            Category
            <input id="tagInput" name="tag" autocomplete="off">
          </label>
          <input id="iconInput" name="icon" type="hidden" value="+">
          <section id="iconPicker" class="iconPicker" aria-label="Category icon"></section>
          <div class="grid">
            <label>
              Latitude
              <input id="latInput" name="lat" inputmode="decimal" required>
            </label>
            <label>
              Longitude
              <input id="lngInput" name="lng" inputmode="decimal" required>
            </label>
          </div>
          <label>
            Note
            <textarea id="noteInput" name="note" rows="2"></textarea>
          </label>
          <section id="deletePanel" class="deletePanel" hidden>
            <button id="deletePlaceButton" class="dangerButton" type="button">Delete place</button>
          </section>
          <div class="controls">
            <button type="submit">Save</button>
            <button id="cancelButton" type="button">Cancel</button>
          </div>
        </form>
      </section>

      <p id="toast" class="toast" hidden></p>

      <section class="bottomBar">
        <button id="addButton" class="navButton primary" type="button" aria-label="Add place">Add</button>
        <button id="placesButton" class="navButton isActive" type="button" aria-label="Places">Places</button>
        <button id="categoriesButton" class="navButton" type="button" aria-label="Categories">Categories</button>
        <button id="importButton" class="navButton" type="button" aria-label="Import places">Import</button>
        <button id="exportButton" class="navButton" type="button" aria-label="Export places">Export</button>
      </section>
    </main>

    <template id="placeTemplate">
      <li>
        <button class="placeButton" type="button">
          <span class="placeName"></span>
          <span class="placeMeta"></span>
        </button>
        <button class="deleteButton" type="button" aria-label="Delete place">x</button>
      </li>
    </template>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
  </body>
</html>
